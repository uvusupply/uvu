<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UVU Supply · Running gear that keeps pace</title>
<meta name="description" content="Running gear from UVU Supply. Live stock: what's ready now, what's on the way, and what just sold.">
<meta property="og:title" content="UVU Supply · Running gear that keeps pace">
<meta property="og:description" content="Live stock: what's ready now, what's on the way, and what just sold.">
<meta name="theme-color" content="#0a0a0a">
<script data-goatcounter="https://uvusupply.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<style>
:root{--bg:#0a0a0a;--card:#141414;--card2:#1b1b1b;--line:#262626;--text:#f5f5f5;--muted:#9a9a9a;--brand:#DE1D4B;--ok:#3ecf8e;--warn:#f5a524;
--display:"Avenir Next Condensed","Helvetica Neue Condensed","Roboto Condensed","Arial Narrow",Impact,system-ui,sans-serif}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:16px;padding-right:16px}
.disp{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.01em}

/* Hero: a night track, lanes running off to the right */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top)) 0 34px;
  background:radial-gradient(120% 90% at 85% 0%,rgba(222,29,75,.28),transparent 60%),var(--bg)}
.lanes{position:absolute;inset:0;pointer-events:none;opacity:.5;transform:skewX(-18deg) scale(1.3);
  background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(255,255,255,.055) 118px 120px)}
.streak{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--brand));animation:streak 3.2s linear infinite}
.streak:nth-child(1){top:22%;width:180px}
.streak:nth-child(2){top:48%;width:120px;animation-delay:1.1s;animation-duration:2.6s}
.streak:nth-child(3){top:74%;width:240px;animation-delay:2s;animation-duration:3.8s}
@keyframes streak{from{left:-260px;opacity:0}15%{opacity:1}to{left:110%;opacity:0}}
.hero .wrap{position:relative}
.brand{display:inline-flex;align-items:flex-end;gap:10px;text-decoration:none;color:var(--text)}
.brand .bars{display:flex;flex-direction:column;gap:4px;padding-bottom:5px}
.brand .bars i{display:block;height:4px;border-radius:2px;background:var(--brand)}
.brand b{font-size:30px;line-height:.9;font-weight:900;letter-spacing:-.02em}
.brand small{display:block;color:var(--brand);font-size:10px;font-weight:800;letter-spacing:.5em;margin-top:4px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:36px;align-items:end;margin-top:34px}
.hero h1{margin:0;font-size:clamp(46px,9vw,104px);line-height:.88}
.hero h1 em{font-style:inherit;color:var(--brand);display:block}
.lede{margin:16px 0 0;color:#cfcfcf;font-size:17px;max-width:46ch}
.order{margin:8px 0 0;font-weight:600}
.order a{color:var(--brand);font-weight:800;text-decoration:none;border-bottom:1px solid rgba(222,29,75,.45)}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:800;text-decoration:none;border:1px solid var(--line);color:var(--text);background:transparent;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.small{padding:7px 13px;font-size:13px}

/* Stats as race bibs */
.bibs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:26px;max-width:520px}
.bib{position:relative;background:#f4f1ea;color:#111;border:0;border-radius:8px;padding:14px 8px 10px;text-align:center;cursor:pointer;transition:transform .15s;
  background-image:radial-gradient(circle at 9px 9px,#0a0a0a 2.5px,transparent 3px),radial-gradient(circle at calc(100% - 9px) 9px,#0a0a0a 2.5px,transparent 3px)}
.bib:hover{transform:translateY(-2px) rotate(-1deg)}
.bib b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(34px,6vw,52px);line-height:.95}
.bib span{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;border-top:2px solid var(--brand);margin:6px 6px 0;padding-top:5px}

/* Just sold feed */
.feed h2{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--brand);display:flex;align-items:center;gap:8px;text-transform:uppercase}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(222,29,75,.7)}100%{box-shadow:0 0 0 12px rgba(222,29,75,0)}}
.feed-row{display:grid;gap:8px}
.sold-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:rgba(20,20,20,.86);border:1px solid var(--line);border-radius:12px;padding:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sold-item .th{width:64px;height:64px;border-radius:8px;background:var(--card2);object-fit:cover}
.sold-item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sold-item span{color:var(--muted);font-size:13px}
.stamp{font-family:var(--display);font-style:italic;font-weight:800;font-size:13px;letter-spacing:.08em;color:var(--brand);border:2px solid var(--brand);border-radius:6px;padding:2px 7px;transform:rotate(-6deg);text-transform:uppercase}

/* Next drop strip */
.drop{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;width:100%;border:0;border-bottom:1px solid var(--line);background:#111;color:var(--text);padding:11px 16px;cursor:pointer;font-size:14px;text-align:center}
.drop b{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}

/* Filters */
.shop-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding-top:26px}
.shop-head h2{margin:0;font-size:clamp(28px,5vw,44px);line-height:1}
input[type=search]{flex:0 1 300px;min-width:0;width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:10px 16px;font:inherit}
.controls{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-top:14px;padding:10px 0}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
.scroller::-webkit-scrollbar{display:none}
.scroller + .scroller{margin-top:8px}
.tab,.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab{padding:8px 16px;font-weight:700}
.tab small{color:var(--muted);font-weight:600;margin-left:4px}
.tab[aria-pressed=true]{background:var(--text);border-color:var(--text);color:#111}
.tab[aria-pressed=true] small{color:#444}
.chip{padding:5px 12px;font-size:13px;color:#d0d0d0}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.lbl{flex:none;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.sep{flex:none;width:1px;height:18px;background:var(--line);margin:0 4px}
.count{color:var(--muted);font-size:13px;margin:14px 0 4px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:6px 0 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;
  transition:transform .18s,border-color .18s;animation:rise .45s both}
.card:hover{transform:translateY(-4px);border-color:#3a3a3a}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph{position:relative;aspect-ratio:4/5;background:var(--card2);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .ph img{transform:scale(1.04)}
.ph.none{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(-60deg,#181818 0 14px,#141414 14px 28px);color:#3d3d3d;font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;letter-spacing:.04em}
.badge{position:absolute;left:10px;top:10px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:rgba(10,10,10,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.badge.ready{color:var(--ok)}.badge.way{color:var(--warn)}.badge.gone{color:var(--muted)}
.more{position:absolute;right:10px;bottom:10px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:rgba(10,10,10,.75)}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{color:var(--brand);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.cb h3{margin:0;font-size:17px;line-height:1.2}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{font-size:12px;font-weight:800;border-radius:6px;padding:3px 8px;border:1.5px solid var(--ok);color:var(--ok)}
.pill.w{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.pill.x{border-color:#333;color:#666;text-decoration:line-through}
.meta{color:var(--muted);font-size:13px;margin-top:auto;padding-top:4px}
.sold-card .ph img{filter:grayscale(.5)}
.empty{color:var(--muted);text-align:center;padding:60px 0;grid-column:1/-1}

/* Detail sheet */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);padding:0;width:min(900px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-height:calc(100dvh - 24px)}
.dl-g{position:relative;background:#000;min-height:0}
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;aspect-ratio:4/5}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .2s}
.dots i.on{background:#fff;width:16px;border-radius:3px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer}
.nav.prev{left:8px}.nav.next{right:8px}
@media (hover:none){.nav{display:none}}
.dl-b{padding:22px;overflow-y:auto}
.dl-b h2{margin:4px 0 0;font-size:26px;line-height:1.1}
.rows{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line)}
.rows li{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.size{font-weight:800;text-align:center;background:#222;border-radius:7px;padding:5px 0}
.st small{display:block;color:var(--muted);font-size:12px}
.st.avail b{color:var(--ok)}.st.res b{color:var(--warn)}.st.sold b{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:14px 0 0}
.x{position:absolute;right:10px;top:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:#111;font-weight:700;border-radius:999px;padding:10px 18px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5)}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:26px 0 calc(30px + env(safe-area-inset-bottom));text-align:center}
footer a{color:var(--text)}

@media (max-width:820px){
  .hero-grid{grid-template-columns:1fr;gap:26px}
  .dl{grid-template-columns:1fr;overflow-y:auto}
  .dl-b{overflow:visible}
  .slides img{aspect-ratio:1}
}
@media (max-width:520px){
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .cb{padding:10px}.cb h3{font-size:15px}
  .bib span{letter-spacing:.06em}
  dialog{width:100vw;max-width:100vw;max-height:92dvh;margin:auto 0 0;border-radius:18px 18px 0 0}
  .dl{max-height:92dvh}
  .rows li{grid-template-columns:46px 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

,"pieces":[{"date":"2026-10-22T04:43:30Z","size":"L","soldTo":"po•••el"}]},{"category":"Top","image":"images\/f92afaa15e2dc688.jpg","name":"UVU text cutoff shirt","pieces":[{"date":"2026-10-22T04:43:26Z","size":"XL","soldTo":"po•••el"}]},{"category":"Tights","image":"images\/14fa6e4625f6aa1c.jpg","name":"Red and yellow tights","pieces":[{"date":"2026-10-22T04:43:21Z","size":"XL","soldTo":"po•••el"}]},{"category":"Other","image":"images\/b69ef20862f4db45.jpg","name":"UVU purple gloves","pieces":[{"date":"2026-10-20T09:57:22Z","size":"M","soldTo":"ad•••da"}]},{"category":"Tights","image":"images\/ec40f25ba9275fc9.jpg","name":"Teal tights v2","pieces":[{"date":"2026-10-19T09:40:14Z","size":"XL","soldTo":"f•••e"},{"date":"2026-10-19T09:39:48Z","size":"L","soldTo":"ad•••da"},{"date":"2026-10-13T18:37:21Z","size":"S","soldTo":"co•••to"}]},{"category":"Other","image":"images\/e66e553bbb1a90e4.jpg","name":"Black cap uvu","pieces":[{"date":"2026-10-19T09:39:42Z","size":"L","soldTo":"ad•••da"}]},{"category":"Tights","image":"images\/60989cab83164ed9.jpg","name":"Grey tights v1","pieces":[{"date":"2026-10-14T06:17:25Z","size":"L","soldTo":"co•••ly"}]},{"category":"Singlet","image":"images\/b07a89cdfc0737a0.jpg","name":"Paris running singlet","pieces":[{"date":"2026-10-13T18:34:41Z","size":"S","soldTo":"co•••to"},{"date":"2026-10-13T18:30:39Z","size":"XL","soldTo":"po•••el"}]}],"updated":"2026-11-10T18:31:06Z"}</script>
<script>
(function(){
  var data = JSON.parse(document.getElementById('data').textContent);
  data.sold = data.sold || []; data.latest = data.latest || [];
  var state = {stage:'all', q:'', cat:'', size:''};
  var $ = function(id){ return document.getElementById(id); };
  var fmt = function(iso){ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); };
  var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var plural = function(n,w){ return n+' '+w+(n===1?'':'s'); };
  var RANK = ['XXS','XS','S','S/M','M','M/L','L','L/XL','XL','XXL','XXXL'];
  var rank = function(s){ var i = RANK.indexOf(String(s).toUpperCase()); return i<0 ? 99 : i; };
  var free = function(p){ return p.reservedTo==null && p.soldTo==null; };
  var hand = function(p){ return p.stage==='onHand'; };

  // How to order: any @handle links to Instagram; the first one powers the DM buttons.
  var handle = (data.howToOrder.match(/@([A-Za-z0-9._]*[A-Za-z0-9_])/)||[])[1];
  var dmURL = handle ? 'https://www.instagram.com/'+handle+'/' : '';
  $('order').innerHTML = esc(data.howToOrder).replace(/@([A-Za-z0-9._]*[A-Za-z0-9_])/g,
    '<a href="https://www.instagram.com/$1/" target="_blank" rel="noopener">@$1</a>');
  if(handle){
    $('dm').href = dmURL; $('dm').textContent = 'Message @'+handle; $('dm').hidden = false;
    $('foot-ig').innerHTML = ' · <a href="https://www.instagram.com/'+esc(handle)+'/" target="_blank" rel="noopener">@'+esc(handle)+' on Instagram</a>';
  }
  $('updated').textContent = 'Updated ' + new Date(data.updated).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});

  // Totals
  var all = []; data.items.forEach(function(it){ it.pieces.forEach(function(p){ all.push(p); }); });
  var nReady = all.filter(function(p){ return free(p) && hand(p); }).length;
  var nWay = all.filter(function(p){ return free(p) && !hand(p); }).length;
  var nSold = data.sold.reduce(function(n,g){ return n+g.pieces.length; },0);

  // Race bibs
  [['onHand',nReady,'Ready now'],['incoming',nWay,'On the way'],['sold',nSold,'Delivered']].forEach(function(b){
    var el = document.createElement('button');
    el.className = 'bib'; el.innerHTML = '<b>'+b[1]+'</b><span>'+b[2]+'</span>';
    el.setAttribute('aria-label', b[1]+' '+b[2]);
    el.onclick = function(){ setStage(b[0]); $('shop').scrollIntoView(); };
    $('bibs').appendChild(el);
  });

  // Just sold
  if(data.latest.length){
    $('latest').innerHTML = '<h2><i class="pulse"></i>Fresh off the line</h2><div class="feed-row">'+data.latest.map(function(s){
      return '<div class="sold-item">'+(s.image ? '<img class="th" src="'+esc(s.image)+'" alt="" loading="lazy">' : '<div class="th"></div>')+
        '<div style="min-width:0"><b>'+esc(s.name)+'</b><span>'+esc(s.size||'One size')+' · '+fmt(s.date)+'</span></div><i class="stamp">Sold</i></div>';
    }).join('')+'</div>';
    $('latest').hidden = false;
  }

  // Next drop
  var incoming = all.filter(function(p){ return !hand(p); });
  if(incoming.length){
    var etas = incoming.map(function(p){ return p.eta; }).filter(Boolean).sort();
    var when = 'ETA to be announced';
    if(etas.length){
      var days = Math.ceil((new Date(etas[0]) - Date.now())/864e5);
      when = days>1 ? 'lands in '+days+' days ('+fmt(etas[0])+')' : days===1 ? 'lands tomorrow' : 'arriving any day now';
    }
    $('drop').innerHTML = '<b>Next drop</b> '+esc(when)+' · '+(nWay ? plural(nWay,'piece')+' still open →' : 'all spoken for');
    $('drop').onclick = function(){ setStage('incoming'); $('shop').scrollIntoView(); };
    $('drop').hidden = false;
  }

  // Stage tabs + category / size chips
  var stages = [['all','All',nReady+nWay],['onHand','Ready now',nReady],['incoming','On the way',nWay],['sold','Sold and Delivered',nSold]];
  stages.forEach(function(s){
    var b = document.createElement('button');
    b.className='tab'; b.dataset.v=s[0]; b.innerHTML = esc(s[1])+'<small>'+s[2]+'</small>';
    b.onclick=function(){ setStage(s[0]); };
    $('stages').appendChild(b);
  });
  function setStage(v){ state.stage=v; render(); }
  var cats = {}; data.items.concat(data.sold).forEach(function(i){ cats[i.category]=1; });
  var sizes = {}; all.filter(free).forEach(function(p){ if(p.size) sizes[p.size]=1; });
  function chip(kind,label,value){
    return '<button class="chip" data-k="'+kind+'" data-v="'+esc(value)+'" aria-pressed="'+(state[kind]===value)+'">'+esc(label)+'</button>';
  }
  function drawFilters(){
    var c = Object.keys(cats).sort(), s = Object.keys(sizes).sort(function(a,b){ return rank(a)-rank(b) || a.localeCompare(b); });
    $('filters').innerHTML = '<span class="lbl">Type</span>'+chip('cat','All','')+c.map(function(x){ return chip('cat',x,x); }).join('')+
      (s.length ? '<span class="sep"></span><span class="lbl">My size</span>'+chip('size','Any','')+s.map(function(x){ return chip('size',x,x); }).join('') : '');
  }
  $('filters').addEventListener('click',function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    state[b.dataset.k] = b.dataset.v; render();
  });
  $('q').addEventListener('input',function(e){ state.q=e.target.value.trim().toLowerCase(); render(); });

  function etaText(p){
    if(hand(p)) return 'On hand';
    return p.eta ? 'ETA '+fmt(p.eta) : (p.stage==='ordered' ? 'Ordered' : 'In transit')+' · ETA TBA';
  }
  function matches(name,category,pieces){
    if(state.cat && category!==state.cat) return false;
    if(state.size && !pieces.some(function(p){ return p.size===state.size; })) return false;
    if(!state.q) return true;
    return (name+' '+category).toLowerCase().indexOf(state.q)>=0 || pieces.some(function(p){ return String(p.size).toLowerCase()===state.q; });
  }
  function photo(images,name,badge){
    var inner = images.length ? '<img src="'+esc(images[0])+'" alt="'+esc(name)+'" loading="lazy">' : 'UVU';
    return '<div class="ph'+(images.length?'':' none')+'">'+inner+badge+(images.length>1 ? '<span class="more">'+images.length+' photos</span>' : '')+'</div>';
  }

  var shown = [];
  function render(){
    Array.prototype.forEach.call($('stages').children,function(b){ b.setAttribute('aria-pressed', b.dataset.v===state.stage); });
    drawFilters();
    var html = '', pcs = 0; shown = [];
    if(state.stage==='sold'){
      data.sold.forEach(function(g){
        if(!matches(g.name,g.category,g.pieces)) return;
        var last = g.pieces.map(function(p){ return p.date; }).filter(Boolean).sort().pop();
        pcs += g.pieces.length; shown.push({sold:g});
        html += '<button class="card sold-card" data-i="'+(shown.length-1)+'" style="animation-delay:'+Math.min(shown.length*40,400)+'ms">'+
          photo(g.image?[g.image]:[],g.name,'<span class="badge gone">Sold &amp; delivered</span>')+
          '<div class="cb"><div class="cat">'+esc(g.category)+'</div><h3>'+esc(g.name)+'</h3>'+
          '<div class="meta">'+plural(g.pieces.length,'piece')+' delivered'+(last ? ' · last '+fmt(last) : '')+'</div></div></button>';
      });
      $('count').textContent = pcs ? plural(pcs,'piece')+' sold and delivered · '+plural(shown.length,'item') : '';
      $('grid').innerHTML = html || '<p class="empty">No sales to show here yet.</p>';
      return;
    }
    data.items.forEach(function(item){
      var pieces = item.pieces.filter(function(p){ return state.stage==='all' || (state.stage==='onHand') === hand(p); });
      // "My size" means a piece you can still get.
      var sizeOK = !state.size || pieces.some(function(p){ return p.size===state.size && free(p); });
      if(!pieces.length || !sizeOK || !matches(item.name,item.category,pieces)) return;
      var ready = pieces.filter(function(p){ return free(p)&&hand(p); }).length, way = pieces.filter(function(p){ return free(p)&&!hand(p); }).length;
      var eta = pieces.filter(function(p){ return free(p)&&!hand(p)&&p.eta; }).map(function(p){ return p.eta; }).sort()[0];
      var badge = ready ? '<span class="badge ready">Ready now</span>'
        : way ? '<span class="badge way">On the way'+(eta ? ' · '+fmt(eta) : '')+'</span>'
        : '<span class="badge gone">All spoken for</span>';
      var by = {};
      pieces.forEach(function(p){ var k=p.size||'One size'; by[k]=by[k]||{r:0,w:0}; if(free(p)) by[k][hand(p)?'r':'w']++; });
      var pills = Object.keys(by).sort(function(a,b){ return rank(a)-rank(b); }).map(function(k){
        var n = by[k].r+by[k].w;
        return '<span class="pill'+(by[k].r?'':by[k].w?' w':' x')+'">'+esc(k)+(n>1?' ×'+n:'')+'</span>';
      }).join('');
      var meta = [ready ? ready+' ready' : '', way ? way+' on the way' : ''].filter(Boolean).join(' · ') || 'All spoken for';
      pcs += pieces.length; shown.push({item:item,pieces:pieces});
      html += '<button class="card" data-i="'+(shown.length-1)+'" style="animation-delay:'+Math.min(shown.length*40,400)+'ms">'+
        photo(item.images||[],item.name,badge)+
        '<div class="cb"><div class="cat">'+esc(item.category)+'</div><h3>'+esc(item.name)+'</h3><div class="pills">'+pills+'</div><div class="meta">'+meta+'</div></div></button>';
    });
    $('count').textContent = shown.length ? plural(shown.length,'item')+' · '+plural(pcs,'piece') : '';
    $('grid').innerHTML = html || '<p class="empty">Nothing matches right now. Try another size or type, or check back after the next drop.</p>';
  }

  // Detail sheet
  var dlg = $('dlg');
  $('grid').addEventListener('click',function(e){
    var c = e.target.closest('.card'); if(!c) return;
    open(shown[+c.dataset.i]);
  });
  function open(entry){
    var it = entry.item || entry.sold, images = entry.item ? (it.images||[]) : (it.image?[it.image]:[]);
    var gal = images.length ? '<div class="slides">'+images.map(function(src,i){
        return '<img src="'+esc(src)+'" alt="'+esc(it.name)+' photo '+(i+1)+' of '+images.length+'">'; }).join('')+'</div>'+
      (images.length>1 ? '<button class="nav prev" aria-label="Previous photo">‹</button><button class="nav next" aria-label="Next photo">›</button><div class="dots">'+
        images.map(function(_,i){ return '<i'+(i?'':' class="on"')+'></i>'; }).join('')+'</div>' : '')
      : '<div class="ph none" style="height:100%;min-height:220px;aspect-ratio:auto">UVU</div>';
    var rows = entry.item ? entry.pieces.map(function(p){
      var cls = p.soldTo!=null ? 'sold' : p.reservedTo!=null ? 'res' : 'avail';
      var label = p.soldTo!=null ? 'Sold to '+esc(p.soldTo||'a customer') : p.reservedTo!=null ? 'Reserved to '+esc(p.reservedTo||'someone') : 'Available';
      var msg = "Hi UVU Supply! I'd like to order: "+it.name+(p.size ? ', size '+p.size : '')+(hand(p) ? '.' : ' (from the incoming batch).');
      return '<li><span class="size">'+esc(p.size||'—')+'</span><span class="st '+cls+'"><b>'+label+'</b><small>'+esc(etaText(p))+'</small></span>'+
        (cls==='avail' && dmURL ? '<a class="btn primary small" href="'+dmURL+'" target="_blank" rel="noopener" data-msg="'+esc(msg)+'">'+(hand(p)?'Order':'Reserve')+'</a>' : '<span></span>')+'</li>';
    }) : it.pieces.map(function(p){
      return '<li><span class="size">'+esc(p.size||'—')+'</span><span class="st sold"><b>Sold to '+esc(p.soldTo||'a customer')+'</b><small>'+(p.date ? 'Delivered '+fmt(p.date) : 'Date not recorded')+'</small></span><span></span></li>';
    });
    dlg.innerHTML = '<button class="x" aria-label="Close">×</button><div class="dl"><div class="dl-g">'+gal+'</div><div class="dl-b">'+
      '<div class="cat">'+esc(it.category)+'</div><h2 class="disp">'+esc(it.name)+'</h2><ul class="rows">'+rows.join('')+'</ul>'+
      (entry.item && dmURL ? '<p class="hint">Tap Order or Reserve and we copy a ready message for you. Paste it in the DM and send.</p>' : '')+'</div></div>';
    dlg.showModal();
  }
  dlg.addEventListener('click',function(e){
    if(e.target===dlg || e.target.closest('.x')){ dlg.close(); return; }
    var nav = e.target.closest('.nav');
    if(nav){ var s = dlg.querySelector('.slides'); s.scrollBy({left:(nav.classList.contains('next')?1:-1)*s.clientWidth,behavior:'smooth'}); return; }
    var a = e.target.closest('[data-msg]');
    if(a && navigator.clipboard){ navigator.clipboard.writeText(a.dataset.msg).then(function(){ toast('Message copied. Paste it in the DM.'); },function(){}); }
  });
  dlg.addEventListener('scroll',function(e){
    var el = e.target; if(!el.classList || !el.classList.contains('slides')) return;
    var i = Math.round(el.scrollLeft/el.clientWidth), dots = dlg.querySelectorAll('.dots i');
    for(var k=0;k<dots.length;k++) dots[k].className = k===i ? 'on' : '';
  },true);
  function toast(text){
    var t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=text;
    document.body.appendChild(t); setTimeout(function(){ t.remove(); },2600);
  }

  render();
})();
</script>
</body>
</html>
