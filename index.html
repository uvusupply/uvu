<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UVU Supply · Available now</title>
<meta name="description" content="Running gear from UVU Supply: what's on hand and on the way.">
<meta name="theme-color" content="#0a0a0a">
<style>
:root{--bg:#0a0a0a;--card:#151515;--line:#262626;--text:#f5f5f5;--muted:#9a9a9a;--brand:#DE1D4B;--ok:#3ecf8e;--warn:#f5a524}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding:calc(28px + env(safe-area-inset-top)) 0 18px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:flex-end;gap:14px}
.logo .lines{display:flex;flex-direction:column;gap:5px;padding-bottom:8px}
.logo .lines i{display:block;height:5px;border-radius:3px;background:var(--brand)}
.logo h1{margin:0;font-size:44px;line-height:.9;font-weight:900;letter-spacing:-.02em}
.logo small{display:block;color:var(--brand);font-size:13px;font-weight:800;letter-spacing:.55em;margin-top:6px}
.order{margin:18px 0 0;font-size:16px;font-weight:600}
.order a{color:var(--brand);font-weight:800;text-decoration:none;border-bottom:1px solid rgba(222,29,75,.45)}
.order a:hover{border-bottom-color:var(--brand)}
.controls{position:sticky;top:0;z-index:2;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
input[type=search]{flex:1 1 200px;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit}
.count{color:var(--muted);font-size:13px;margin:14px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:6px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.gallery{position:relative;aspect-ratio:4/5;background:#1e1e1e}
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;background:#1e1e1e center/cover no-repeat}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .2s}
.dots i.on{background:#fff;width:16px;border-radius:3px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;line-height:32px;cursor:pointer;opacity:0;transition:opacity .2s}
.nav.prev{left:8px}.nav.next{right:8px}
.gallery:hover .nav{opacity:1}
@media (hover:none){.nav{display:none}}
.photo.none{aspect-ratio:auto;height:64px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#555;font-size:12px;letter-spacing:.2em;font-weight:800;background:linear-gradient(90deg,#1b1b1b,#141414)}
.photo.none i{display:block;width:18px;height:3px;border-radius:2px;background:var(--brand);box-shadow:0 6px 0 var(--brand),0 -6px 0 var(--brand)}
.body{padding:14px}
.body h2{margin:0;font-size:17px}
.cat{color:var(--muted);font-size:13px}
.sizes{margin:8px 0 0;font-size:13px;color:var(--muted)}
.sizes b{color:var(--text)}
ul{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
li:last-child{border-bottom:0}
.size{font-weight:800;text-align:center;background:#222;border-radius:7px;padding:4px 0}
.state.avail{color:var(--ok)}
.state.res{color:var(--warn)}
.state.sold{color:var(--muted)}
.sold-card .gallery{filter:grayscale(.35)}
.eta{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
.eta.hand{color:var(--text)}
.empty{color:var(--muted);text-align:center;padding:60px 0}
footer{color:var(--muted);font-size:12px;padding:0 0 calc(30px + env(safe-area-inset-bottom));text-align:center}
@media (max-width:420px){.logo h1{font-size:36px}.grid{grid-template-columns:1fr 1fr;gap:10px}.body{padding:10px}li{grid-template-columns:40px 1fr;row-gap:2px}.eta{grid-column:2;text-align:left}}
</style>
</head>
<body>

  <div class="logo"><div class="lines"><i style="width:46px"></i><i style="width:32px"></i><i style="width:20px"></i></div>

<main class="wrap">

</main>

<script>
(function(){
  var data = JSON.parse(document.getElementById('data').textContent);
  var state = {stage:'all', q:''};
  var fmt = function(iso){ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); };
  var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };

  // Any @handle in the message links to that Instagram profile.
  document.getElementById('order').innerHTML = esc(data.howToOrder).replace(/@([A-Za-z0-9._]*[A-Za-z0-9_])/g,
    '<a href="https://www.instagram.com/$1/" target="_blank" rel="noopener">@$1</a>');
  document.getElementById('updated').textContent = 'Updated ' + new Date(data.updated).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});

  var stages = [['all','All'],['onHand','On hand'],['incoming','On the way'],['sold','Sold']];
  data.sold = data.sold || [];
  var stageRow = document.getElementById('stages');
  stages.forEach(function(s){
    var b = document.createElement('button');
    b.className='chip'; b.textContent=s[1]; b.dataset.v=s[0];
    b.onclick=function(){ state.stage=s[0]; render(); };
    stageRow.appendChild(b);
  });
  document.getElementById('q').addEventListener('input',function(e){ state.q=e.target.value.trim().toLowerCase(); render(); });

  function inStage(p){
    if(state.stage==='all') return true;
    return state.stage==='onHand' ? p.stage==='onHand' : p.stage!=='onHand';
  }
  function etaText(p){
    if(p.stage==='onHand') return 'On hand';
    var label = p.stage==='ordered' ? 'Ordered' : 'In transit';
    return p.eta ? 'ETA ' + fmt(p.eta) : label + ' · ETA TBA';
  }
  function summary(pieces){
    var hand={}, inc={};
    pieces.forEach(function(p){
      if(p.reservedTo!=null || p.soldTo!=null) return;
      var t = p.stage==='onHand' ? hand : inc; t[p.size]=(t[p.size]||0)+1;
    });
    var f=function(t){ return Object.keys(t).map(function(k){ return t[k]>1 ? k+' ×'+t[k] : k; }).join(', '); };
    var parts=[];
    if(Object.keys(hand).length) parts.push('Available: <b>'+esc(f(hand))+'</b>');
    if(Object.keys(inc).length) parts.push('Coming: <b>'+esc(f(inc))+'</b>');
    return parts.join(' · ') || 'All spoken for';
  }

  function gallery(item){
    var imgs = item.images || [];
    if(!imgs.length) return '<div class="photo none"><i></i>UVU SUPPLY</div>';
    var slides = imgs.map(function(src,i){
      return '<div class="slide" role="img" aria-label="'+esc(item.name)+' photo '+(i+1)+' of '+imgs.length+'" style="background-image:url(\''+esc(src)+'\')"></div>';
    }).join('');
    if(imgs.length===1) return '<div class="gallery"><div class="slides">'+slides+'</div></div>';
    var dots = imgs.map(function(_,i){ return '<i'+(i===0?' class="on"':'')+'></i>'; }).join('');
    return '<div class="gallery"><div class="slides">'+slides+'</div>' +
      '<button class="nav prev" aria-label="Previous photo">‹</button><button class="nav next" aria-label="Next photo">›</button>' +
      '<div class="dots">'+dots+'</div></div>';
  }

  // Galleries: keep dots in sync with swipes, and let arrows page on desktop.
  document.getElementById('grid').addEventListener('scroll', function(e){
    var el = e.target;
    if(!el.classList || !el.classList.contains('slides')) return;
    var i = Math.round(el.scrollLeft / el.clientWidth);
    var dots = el.parentNode.querySelectorAll('.dots i');
    for(var k=0;k<dots.length;k++) dots[k].className = k===i ? 'on' : '';
  }, true);
  document.getElementById('grid').addEventListener('click', function(e){
    var btn = e.target.closest && e.target.closest('.nav');
    if(!btn) return;
    var slides = btn.parentNode.querySelector('.slides');
    slides.scrollBy({left: (btn.classList.contains('next') ? 1 : -1) * slides.clientWidth, behavior:'smooth'});
  });

  function renderSold(grid){
    var html='', pcs=0, groups=0;
    data.sold.forEach(function(g){
      var pieces = g.pieces.filter(function(p){
        return !state.q || (g.name+' '+g.category+' '+p.size).toLowerCase().indexOf(state.q)>=0;
      });
      if(!pieces.length) return;
      groups++; pcs+=pieces.length;
      html += '<article class="card sold-card">' + gallery({name:g.name, images: g.image ? [g.image] : []}) +
        '<div class="body"><h2>'+esc(g.name)+'</h2><div class="cat">'+esc(g.category)+'</div>' +
        '<p class="sizes">'+pieces.length+' sold</p><ul>' +
        pieces.map(function(p){
          return '<li><span class="size">'+esc(p.size||'—')+'</span><span class="state sold">Sold to '+esc(p.soldTo||'a customer')+'</span>' +
            '<span class="eta">'+(p.date ? 'Delivered '+fmt(p.date) : 'Date not recorded')+'</span></li>';
        }).join('') + '</ul></div></article>';
    });
    grid.innerHTML = html || '<p class="empty">No sales to show yet.</p>';
    document.getElementById('count').textContent = pcs ? pcs+' piece'+(pcs===1?'':'s')+' sold · '+groups+' item'+(groups===1?'':'s') : '';
  }

  function render(){
    Array.prototype.forEach.call(stageRow.children,function(b){ b.setAttribute('aria-pressed', b.dataset.v===state.stage); });
    if(state.stage==='sold'){ renderSold(document.getElementById('grid')); return; }
    var grid=document.getElementById('grid'), html='', shown=0, pcs=0;
    data.items.forEach(function(item){
      var pieces = item.pieces.filter(inStage).filter(function(p){
        return !state.q || (item.name+' '+item.category+' '+p.size).toLowerCase().indexOf(state.q)>=0;
      });
      if(!pieces.length) return;
      shown++; pcs+=pieces.length;
      html += '<article class="card">' +
        gallery(item) +
        '<div class="body"><h2>'+esc(item.name)+'</h2><div class="cat">'+esc(item.category)+'</div>' +
        '<p class="sizes">'+summary(pieces)+'</p><ul>' +
        pieces.map(function(p){
          var st = p.soldTo!=null
            ? '<span class="state sold">Sold to '+esc(p.soldTo||'a customer')+'</span>'
            : p.reservedTo!=null
            ? '<span class="state res">Reserved to '+esc(p.reservedTo||'someone')+'</span>'
            : '<span class="state avail">Available</span>';
          return '<li><span class="size">'+esc(p.size||'—')+'</span>'+st+'<span class="eta'+(p.stage==='onHand'?' hand':'')+'">'+esc(etaText(p))+'</span></li>';
        }).join('') + '</ul></div></article>';
    });
    grid.innerHTML = html || '<p class="empty">Nothing here right now. Check back soon!</p>';
    document.getElementById('count').textContent = shown ? shown+' item'+(shown===1?'':'s')+' · '+pcs+' piece'+(pcs===1?'':'s') : '';
  }
  render();
})();
</script>
</body>
</html>
